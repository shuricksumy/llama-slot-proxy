name: GHCR package cleanup (dry run)

# Manual-trigger only, dry-run only, for now. docker-publish.yml pushes a `latest` tag and a
# short-sha tag on every push to main, plus semver tags (e.g. 1.2.3 / 1.2) on a release tag push --
# the sha tags accumulate forever with nothing to clean them up. Review this run's "would delete"
# log output in the Actions tab before flipping `dry-run` to `false` and adding a `schedule:`
# trigger.
on:
  workflow_dispatch: {}

permissions:
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old ghcr.io package versions
        uses: dataaxiom/ghcr-cleanup-action@v1.2.2
        with:
          owner: shuricksumy
          package: 'llama-slot-proxy'
          # Keep `latest` and any release tag (1.2.3, 1.2, ...); delete every other tag (i.e.
          # every short-sha build tag) plus orphaned untagged multi-arch layers.
          delete-tags: '.*'
          exclude-tags: '^latest$|^[0-9]+\.[0-9]+(\.[0-9]+)?$'
          use-regex: true
          delete-untagged: true
          dry-run: true
          log-level: info
