services:
  llama-slot-proxy:
    build: .
    # Or, to use the pre-built image published by CI instead of building
    # locally, see docker-compose.ghcr.yml:
    # image: ghcr.io/shuricksumy/llama-slot-proxy:latest
    container_name: llama-slot-proxy
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./config.yaml:/config/config.yaml:ro
    environment:
      - CONFIG_PATH=/config/config.yaml
      - LOG_LEVEL=INFO
    # If llama-server itself runs as a Docker container on the same host/network,
    # you can drop the ports mapping above and instead put this on the same
    # Docker network as llama-server, then set llama_url in config.yaml to
    # something like http://llama-server:18080 instead of an IP.
